apiVersion: apps/v1
kind: Deployment
metadata: { name: mesh-svc }
spec:
  template:
    spec:
      serviceAccountName: mesh-sa
      containers:
        - name: app
          image: mesh:1.0
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
