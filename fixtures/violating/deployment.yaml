apiVersion: v1
kind: Secret
metadata: { name: db-secret }
type: Opaque
stringData:
  password: hunter2
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: legacy }
spec:
  template:
    spec:
      containers:
        - name: app
          image: legacy:1.0
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef: { name: db-secret, key: password }
